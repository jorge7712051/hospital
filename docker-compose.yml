version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    container_name: db_data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    container_name: api
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - db
    env_file: .env
    volumes:
      - .:/app
    command: sh -c "npm run migration:run && npm run start:dev"

volumes:
  db_data:
